# Caelestia Blush rice: run the SDDM greeter on KWin (Wayland) like the
# Plasma session, so login doesn't re-sync the monitor and the mouse matches.
# Rollback: sudo rm /etc/sddm.conf.d/20-wayland.conf
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
